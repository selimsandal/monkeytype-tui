name: Test and publish native executables

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '12.0.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: sh scripts/build-release.sh
      - name: Publish only the newest main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA" || {
            echo 'Superseded by a newer main commit; skipping publication.'
            exit 0
          }
          version=$(cat dist/VERSION)
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version already exists; skipping rerun."
            exit 0
          fi
          gh release create "$version" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --target "$GITHUB_SHA" --title "$version" \
            --notes "Automated build of $GITHUB_SHA" --latest
